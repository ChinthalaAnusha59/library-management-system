<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Login</title>
    <style>
        body {
            margin: 50;
            padding: 20;
            font-family: Arial, sans-serif;
            background: url('https://i.pinimg.com/1200x/70/07/51/700751feb7ac634f85f01e5bf2591481.jpg') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 450px;
           
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 10px;
            color: #070706;
        }

        .login-container h2 {
            margin-bottom: 25px;
            color: #f73816;
            font-size: 20px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #1a252f;
        }
         .logo {
        display: block;
        margin: 0 auto 15px auto;
        width: 150px;
        }
        .error-message{
        color:red;
        font-size:14px;
        font-weight:bold;
        margin-top:5px;
        margin-bottom:10px;
        }
    </style>
</head>
<body>

    <div class="login-container">
         <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/SAMEER-Logo-Wiki.png/1280px-SAMEER-Logo-Wiki.png" 
         alt="SAMEER Logo" 
         class="logo">
        <h1>Library Management System</h1>

        <h2 id="loginTitle">Admin Login</h2>


        <form action="/login" method="POST">

            <select name="role" id="role" onchange="changeLogin()" required>
                <option value="admin">Admin</option>
                <option value="user">User</option>
            </select>

            <br><br>

            <input type="text"
                name="username"
                placeholder="Enter Username"
                required>

            <br><br>

            <div id="adminDiv">

                <input type="password"
                    name="password"
                    placeholder="Enter Password">

            </div>

            <div id="userDiv" style="display:none;">

                <input type="text"
                    name="department"
                    placeholder="Enter Department">

            </div>

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}

            <br><br>

            <button type="submit">Login</button>
            <br><br>

                

        </form>
    </div>
    <script>



function changeLogin(){

    let role = document.getElementById("role").value;

    if(role=="admin"){

        document.getElementById("adminDiv").style.display="block";
        document.getElementById("userDiv").style.display="none";

        document.getElementById("loginTitle").innerHTML="Admin Login";

    }

    else{

        document.getElementById("adminDiv").style.display="none";
        document.getElementById("userDiv").style.display="block";

        document.getElementById("loginTitle").innerHTML="User Login";

    }

}



</script>

</body>
</html>
